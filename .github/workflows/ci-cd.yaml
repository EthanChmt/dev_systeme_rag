name: CI/CD RAG

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  tests:
    name: Tests automatiques
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer les tests
        run: |
          pytest -v

  deploy:
    name: Déploiement Hugging Face
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Synchroniser avec Hugging Face Spaces
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: EthanChmt/open_agenda_RAG_OC
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: gradio

  verify:
    name: Vérification du déploiement
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Installer huggingface_hub
        run: |
          python -m pip install --upgrade huggingface_hub

      - name: Attendre que le Space soit opérationnel
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          repo_id = "EthanChmt/open_agenda_RAG_OC"

          api = HfApi(token=os.environ["HF_TOKEN"])

          print("Attente de la fin du déploiement Hugging Face...")

          api.wait_for_space(
              repo_id=repo_id,
              timeout=900,
          )

          runtime = api.get_space_runtime(repo_id=repo_id)

          print(f"État final du Space : {runtime.stage}")

          if str(runtime.stage) != "RUNNING":
              raise RuntimeError(
                  f"Le Space n'est pas opérationnel : {runtime.stage}"
              )

          print("Déploiement vérifié avec succès.")
          PY