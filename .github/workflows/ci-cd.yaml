name: CI RAG local

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-rag-${{ github.ref }}
  cancel-in-progress: true


jobs:
  tests:
    name: Tests Python et pipeline RAG
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OPENAGENDA_API_KEY: ${{ secrets.OPENAGENDA_API_KEY }}
      OPENAGENDA_AGENDA_UID: ${{ secrets.OPENAGENDA_AGENDA_UID }}

      OPENAGENDA_SEARCH: ""
      OPENAGENDA_CITY: ""
      OPENAGENDA_MAX_PAST_EVENTS: "100"
      OPENAGENDA_MAX_FUTURE_EVENTS: "300"

      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MISTRAL_EMBEDDING_MODEL: "mistral-embed"

      HUGGINGFACE_GENERATION_MODEL: "Qwen/Qwen2.5-1.5B-Instruct"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Mettre à jour pip
        run: |
          python -m pip install --upgrade pip

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt

      - name: Vérifier les variables obligatoires
        shell: bash
        run: |
          if [ -z "$OPENAGENDA_API_KEY" ]; then
            echo "Le secret OPENAGENDA_API_KEY est absent."
            exit 1
          fi

          if [ -z "$OPENAGENDA_AGENDA_UID" ]; then
            echo "Le secret OPENAGENDA_AGENDA_UID est absent."
            exit 1
          fi

          if [ -z "$MISTRAL_API_KEY" ]; then
            echo "Le secret MISTRAL_API_KEY est absent."
            exit 1
          fi

      - name: Récupérer les événements OpenAgenda
        run: |
          python scripts/fetch_openagenda_events.py

      - name: Vérifier le fichier de données
        shell: bash
        run: |
          test -f data/events_openagenda.csv

          python - <<'PY'
          import pandas as pd

          path = "data/events_openagenda.csv"
          df = pd.read_csv(path)

          if df.empty:
              raise SystemExit(
                  "Le fichier OpenAgenda est vide."
              )

          print(
              f"{len(df)} événements disponibles "
              "pour l'indexation."
          )
          PY

      - name: Construire l’index FAISS
        run: |
          python scripts/build_faiss_index.py

      - name: Vérifier les fichiers FAISS
        shell: bash
        run: |
          test -f vectorstore/faiss_index/index.faiss
          test -f vectorstore/faiss_index/index.pkl

      - name: Lancer les tests
        run: |
          pytest -v


  docker:
    name: Vérification de l’image Docker
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 30

    # Le build Docker est réalisé après un push sur develop
    # ou après un lancement manuel, mais pas à chaque pull request.
    if: github.event_name != 'pull_request'

    env:
      OPENAGENDA_API_KEY: ${{ secrets.OPENAGENDA_API_KEY }}
      OPENAGENDA_AGENDA_UID: ${{ secrets.OPENAGENDA_AGENDA_UID }}

      OPENAGENDA_SEARCH: ""
      OPENAGENDA_CITY: ""
      OPENAGENDA_MAX_PAST_EVENTS: "100"
      OPENAGENDA_MAX_FUTURE_EVENTS: "300"

      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MISTRAL_EMBEDDING_MODEL: "mistral-embed"

      HUGGINGFACE_GENERATION_MODEL: "Qwen/Qwen2.5-1.5B-Instruct"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l’image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: open-agenda-rag:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lancer le conteneur
        shell: bash
        run: |
          docker run --detach \
            --name open-agenda-rag-test \
            --publish 8000:8000 \
            --env MISTRAL_API_KEY="$MISTRAL_API_KEY" \
            --env MISTRAL_EMBEDDING_MODEL="$MISTRAL_EMBEDDING_MODEL" \
            --env HUGGINGFACE_GENERATION_MODEL="$HUGGINGFACE_GENERATION_MODEL" \
            --env OPENAGENDA_API_KEY="$OPENAGENDA_API_KEY" \
            --env OPENAGENDA_AGENDA_UID="$OPENAGENDA_AGENDA_UID" \
            --env OPENAGENDA_SEARCH="$OPENAGENDA_SEARCH" \
            --env OPENAGENDA_CITY="$OPENAGENDA_CITY" \
            --env OPENAGENDA_MAX_PAST_EVENTS="$OPENAGENDA_MAX_PAST_EVENTS" \
            --env OPENAGENDA_MAX_FUTURE_EVENTS="$OPENAGENDA_MAX_FUTURE_EVENTS" \
            --env PORT="8000" \
            open-agenda-rag:${{ github.sha }}

      - name: Attendre le démarrage de l’API
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8000/health
            then
              echo
              echo "L’API Docker fonctionne correctement."
              exit 0
            fi

            echo \
              "Tentative ${attempt}/60 : " \
              "API non disponible."

            sleep 10
          done

          echo \
            "Le conteneur n’a pas démarré " \
            "dans le délai prévu."

          docker logs open-agenda-rag-test
          exit 1

      - name: Vérifier la documentation FastAPI
        run: |
          curl \
            --fail \
            --silent \
            --output /dev/null \
            http://127.0.0.1:8000/docs

      - name: Vérifier l’interface Gradio
        run: |
          curl \
            --fail \
            --silent \
            --output /dev/null \
            http://127.0.0.1:8000/interface/

      - name: Afficher les journaux Docker
        if: always()
        run: |
          docker logs open-agenda-rag-test || true

      - name: Supprimer le conteneur
        if: always()
        run: |
          docker rm \
            --force \
            open-agenda-rag-test \
            || true