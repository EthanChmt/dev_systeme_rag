name: CI/CD Docker RAG

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/ethanchmt/dev_systeme_rag

jobs:
  tests:
    name: Tests Python
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Récupérer les données OpenAgenda
        env:
          OPENAGENDA_API_KEY: ${{ secrets.OPENAGENDA_API_KEY }}
          OPENAGENDA_AGENDA_UID: "2476341"
          OPENAGENDA_SEARCH: ""
          OPENAGENDA_CITY: ""
          OPENAGENDA_MAX_EVENTS: "300"
        run: |
          python scripts/fetch_openagenda_events.py

      - name: Construire l'index FAISS
        run: |
          python scripts/build_faiss_index.py

      - name: Lancer les tests
        run: |
          pytest -v

  docker:
    name: Construire et publier l'image Docker
    runs-on: ubuntu-latest
    needs: tests

    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Construire l'image Docker
        run: |
          docker build \
            --tag open-agenda-rag:test \
            --tag ${{ env.IMAGE_NAME }}:latest \
            --tag ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Lancer le conteneur de test
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAGENDA_API_KEY: ${{ secrets.OPENAGENDA_API_KEY }}
        run: |
          docker run --detach \
            --name open-agenda-rag-test \
            --publish 8000:8000 \
            --env MISTRAL_API_KEY="$MISTRAL_API_KEY" \
            --env MISTRAL_MODEL="ministral-3b-2512" \
            --env OPENAGENDA_API_KEY="$OPENAGENDA_API_KEY" \
            --env OPENAGENDA_AGENDA_UID="2476341" \
            --env OPENAGENDA_SEARCH="" \
            --env OPENAGENDA_CITY="" \
            --env OPENAGENDA_MAX_EVENTS="300" \
            --env PORT="8000" \
            open-agenda-rag:test

      - name: Vérifier le conteneur
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              echo "L'API Docker répond correctement."
              exit 0
            fi

            echo "Tentative ${attempt}/30 : API non disponible."
            sleep 10
          done

          echo "Le conteneur n'a pas démarré correctement."
          docker logs open-agenda-rag-test
          exit 1

      - name: Afficher les journaux du conteneur
        if: always()
        run: |
          docker logs open-agenda-rag-test || true

      - name: Arrêter le conteneur de test
        if: always()
        run: |
          docker rm --force open-agenda-rag-test || true

      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image Docker
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}